[package]
name = "kira-mitoqc"
description = "Deterministic mitochondrial QC scoring for single-cell expression matrices."
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ARyaskov/kira-mitoqc"
keywords = [
    "bioinformatics",
    "oncology",
    "quality-control",
    "cell",
    "mitochondria"
]
categories = [
    "science",
    "science::bioinformatics",
    "command-line-utilities",
    "algorithms"
]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
sprs = "0.11"
flate2 = { version = "1", features = ["zlib-rs"] }
hdf5 = { version = "0.8", optional = true }
kira-shared-sc-cache = "0.2.1"
kira-scio = "0.2.1"
rayon = "1.11"
rustc-hash = "2"


[features]
default = []
h5ad = ["hdf5", "kira-scio/h5ad"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
